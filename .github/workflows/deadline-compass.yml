name: Deadline Compass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deadline-compass.yml"
      - "data/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "package.json"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Refresh public data
        run: python3 scripts/build_data.py

      - name: Commit genuine data changes
        run: |
          if git diff --quiet -- site/data/events.json site/data/events.csv; then
            echo "No source-data changes."
            exit 0
          fi
          git config user.name "deadline-compass[bot]"
          git config user.email "deadline-compass[bot]@users.noreply.github.com"
          git add -- site/data/events.json site/data/events.csv
          git diff --cached --check
          git commit -m "data: refresh Deadline Compass index"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Warn when the index is unverified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A green build says the pipeline works, not that the dates are
          # true. Nothing here scrapes, so the index only becomes correct
          # when a person re-reads the venue pages; this is the reminder.
          CHECKED=$(python3 -c "import json;print(json.load(open('data/events-source.json'))['source_checked_at'])")
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$CHECKED" +%s) ) / 86400 ))
          echo "index last reviewed $CHECKED ($AGE days ago)"
          if [ "$AGE" -le 30 ]; then
            exit 0
          fi
          gh label create compass-staleness \
            --color EDC537 --description "The index needs re-reading against its sources" \
            >/dev/null 2>&1 || true
          OPEN=$(gh issue list --label compass-staleness --state open --limit 1 --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "an open compass-staleness issue already reports this"
            exit 0
          fi
          gh issue create --label compass-staleness \
            --title "Index unverified for $AGE days" \
            --body "\`data/events-source.json\` was last reviewed on **$CHECKED**, $AGE days ago.

          Deadlines move, and nothing in this repository scrapes: the index is
          only as true as its last human reading. Re-read every venue with a
          gate inside 60 days against its own CFP page, update the record,
          bump \`source_checked_at\`, run \`npm run check\`, and close this issue.

          Priority order: rows marked \`projected\`, then \`announced\`, then
          \`verified\` rows whose gate falls inside 30 days."

  build:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify tracked build
        run: npm run verify

      - name: Stamp the build
        run: |
          # Deployed with the site but never committed: it is the only thing
          # on the page that changes when nothing else does, which is what
          # makes a stalled pipeline visible to a reader.
          printf '{"built_at":"%s","commit":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" \
            > site/data/build-info.json

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
